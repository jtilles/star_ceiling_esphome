; Standalone replacement firmware for the Illuminate 1.0 Top-Star / Bot-Star
; ATmega328P zone MCUs. Same image flashed onto both chips (matches the
; original board's architecture - see docs/illuminate-hardware-notes.md and
; docs/illuminate-firmware-notes.md). Main and RGBW stay on stock firmware.
;
; Board choice: "pro16MHzatmega328" matches the confirmed hardware (bare
; ATmega328P, 16MHz external crystal, 5V) closely enough to borrow its
; fuse/clock settings even though there's no physical Arduino Pro Mini
; involved - upload goes over ISP, not the (nonexistent) serial bootloader.

[env:star_zone]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
board_build.f_cpu = 16000000L

; Flash over the chip's existing ISP-6 header. Swap upload_protocol/
; upload_flags for whatever programmer you actually have (usbasp shown here;
; arduino-as-isp, avrispmkii, and stk500v1/v2 are common alternatives - see
; README "Install (flash via ISP)" section).
upload_protocol = usbasp
; -B 10 slows the ISP clock (10us bit period, ~100kHz) - USBasp's default
; speed is too fast for some ISP wiring/signal quality and produces
; intermittent verify failures at seemingly random byte offsets rather than
; an outright connection failure. Raise further (e.g. -B 20) if verification
; still fails after this.
upload_flags =
    -Pusb
    -B10

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

monitor_speed = 9600
build_flags =
    -Wall
    -Wextra
